# Gold cases for the generator eval: the same questions as
# goldens/retrieval.yaml, each with the minimal golden context needed to
# answer it. The generator gets exactly this context (no retriever), so a bad
# answer is the generator's fault.
#
# Each case has:
#   id, type, question  as in goldens/retrieval.yaml (keep them in sync)
#   golden_context      the passages needed to answer, one per brochure page:
#     doc, page         brochure id (data/corpus.yaml) and 1-based PDF page,
#                       shown to the generator as "Source: <file> / Page: <n>"
#     text              only the lines of that page the answer needs, copied
#                       from the text the app's loader (pdfplumber) extracts,
#                       so the generator reads brochure text as in production
#
# Where the extracted text interleaves columns or loses a drawing's labels,
# the passage is rebuilt from the printed page in the same words; those are
# marked `# rebuilt:` and are worth checking against the PDF.

