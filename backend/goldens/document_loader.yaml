# Gold facts for the document-loader eval, read off the rendered brochure
# pages by hand (never copied from any loader's output, so no loader is
# favoured). Page numbers are 1-based PDF pages.
#
# Each fact has:
#   doc, page   where the fact is printed
#   label       the table row label (omit for plain text facts)
#   values      what must be extracted, left-to-right as printed
#   match       "ordered" (default): values appear in this order on the row
#               "contiguous": values appear back-to-back (for S / - matrices
#               where single letters would otherwise match anywhere)
#
# The kind is derived from the shape:
#   text  no label             -> was the text extracted on the right page?
#   cell  label + one value    -> did the value stay on its label's row?
#   row   label + many values  -> did the row's columns stay in order?

facts:
